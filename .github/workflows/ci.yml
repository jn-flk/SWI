name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Migrate
        run: python src/rezervace_divadlo/manage.py migrate --noinput
      - name: System check
        run: python src/rezervace_divadlo/manage.py check
      - name: Tests
        run: python src/rezervace_divadlo/manage.py test notification reservation
