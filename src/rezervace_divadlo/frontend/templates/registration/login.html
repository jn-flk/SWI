{% extends "base.html" %}

{% block title %}Přihlášení{% endblock %}

{% block content %}
  <h1>Přihlášení</h1>
  <form method="post" class="form">
    {% csrf_token %}
    {{ form.as_div }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="button">Přihlásit</button>
  </form>
{% endblock %}
